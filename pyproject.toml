[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendforge-studio"
version = "1.1.0"
description = "Local Windows studio for YouTube Shorts, long videos, and narrated docuseries from trending topics."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "TrendForge" }]
dependencies = [
  "PySide6>=6.7,<6.12",
  "httpx>=0.27,<0.29",
  "feedparser>=6.0.11,<7",
  "Pillow>=10.4,<12",
  "imageio-ffmpeg>=0.5.1,<0.6",
  "pyttsx3>=2.90,<3",
  "yt-dlp>=2024.12.13",
  "psutil>=6.0,<8",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0,<2"]
cloud-tts = ["edge-tts>=6.1,<8"]
nvidia = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[project.scripts]
trendforge = "trendforge.app:main"

[tool.setuptools.packages.find]
include = ["trendforge*"]

[tool.setuptools.package-data]
trendforge = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
